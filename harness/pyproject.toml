[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-fusion"
version = "0.1.0"
description = "SWE-bench-style evaluation harness for the Physical-AI-Fusion benchmark (physics AI x nuclear fusion, ICF-focused)"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["benchmark", "fusion", "ICF", "physics", "LLM", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
physical-ai-fusion = "physical_ai_fusion.cli:main"

[tool.setuptools.packages.find]
include = ["physical_ai_fusion*"]
