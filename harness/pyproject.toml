[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-fusion"
version = "0.1.0"
description = "Physical-AI-Fusion: a SWE-bench-style benchmark for physics AI, focused on nuclear fusion (ICF-heavy)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Physical-AI-Fusion Team" }]
dependencies = []

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
judge = ["openai>=1.0"]
dev = ["pytest>=7", "sympy>=1.12"]

[project.scripts]
physical-ai-fusion = "physical_ai_fusion.cli:main"
paf = "physical_ai_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["physical_ai_fusion*"]
